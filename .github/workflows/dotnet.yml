name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to use for the API base URL
        required: true
        type: environment
      test_filter:
        description: Optional dotnet test filter (for example, FullyQualifiedName~QuoteApiTests)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'test' }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            dotnet test --configuration Release --filter "$TEST_FILTER" --logger "trx;LogFileName=test-results.trx"
          else
            dotnet test --configuration Release --logger "trx;LogFileName=test-results.trx"
          fi

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET test results
          path: "**/TestResults/test-results.trx"
          reporter: dotnet-trx